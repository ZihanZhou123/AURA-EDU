<!DOCTYPE html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>AURA EDU · 教师体验验收</title><link rel="stylesheet" href="style.css"><script defer src="content.js"></script><script defer src="curriculum.js"></script><script defer src="dialogue.js"></script><script defer src="engine.js"></script><script defer src="teacher.js"></script><style>main{max-width:950px;margin:40px auto;padding:25px}section{padding:25px;background:white;border:1px solid var(--line);border-radius:17px;margin:22px 0}h1{font-size:28px;margin:15px 0}h2{font-size:19px;margin:12px 0}.toolbar{display:flex;gap:15px;flex-wrap:wrap}.toolbar label{display:block;margin-bottom:7px}.toolbar select{padding:10px;border:1px solid var(--line);border-radius:9px}audio{width:100%;margin:20px 0}pre{white-space:pre-wrap;overflow-wrap:anywhere;font-size:11px;line-height:1.9}label{font-size:12px}.reviewer{max-width:600px}input[type=password]{padding:12px;width:100%;border:1px solid var(--line);border-radius:9px;margin:12px 0}</style></head><body><main><a href="./">← 返回学生体验</a><h1>教师体验验收</h1><p class="scope-text">此页用于当前浏览器的原型验收。演示口令不是正式账号安全机制；不用于真实学生的高风险评价。</p><section id="login"><label for="demoCode">输入演示口令</label><input id="demoCode" type="password" placeholder="查看项目说明中的演示口令"><button id="loginButton" class="btn primary">进入演示</button><p id="loginError" class="error" role="status"></p></section><div id="reviewPanel" hidden><section><div class="toolbar"><div><label for="learner">学习昵称</label><select id="learner"></select></div><div><label for="teacherGrade">年级</label><label for="teacherTerm">册次</label><select id="teacherTerm"><option value="a">上册</option><option value="b">下册</option></select><select id="teacherGrade"><option value="3">三年级</option><option value="4">四年级</option><option value="5">五年级</option><option value="6">六年级</option></select></div><button id="refresh" class="btn">重新读取</button></div></section><div id="report"></div></div></main></body></html>
